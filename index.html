<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f6f91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="校了さん">
  <meta name="description" content="校了のタスク・曲リスト・練習タイテ・セトリ作成・メトロノーム">
  <link rel="icon" sizes="192x192" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=5">
  <title>校了さん</title>
  <link rel="stylesheet" href="./firebase-auth.css?v=5">
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="auth-screen" class="auth-screen" aria-label="ログイン">
    <div class="auth-card">
      <img src="./icons/icon-192.png" width="72" height="72" alt="校了さんのアイコン">
      <h1>校了さん</h1>
      <p id="auth-message" role="status">接続しています…</p>
      <div class="auth-spinner" aria-hidden="true"></div>
      <form id="login-form" hidden>
        <label>メールアドレス<input name="email" type="email" autocomplete="username" inputmode="email" required></label>
        <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">ログイン</button>
      </form>
      <button class="auth-logout" data-auth-action="logout" type="button">別のアカウントを使用</button>
    </div>
  </section>
  <script src="./firebase-config.js?v=5"></script>
  <script src="./cloud-model.js?v=5"></script>
  <script src="./songs.js?v=5"></script>
  <script src="./details.js?v=5"></script>
  <script src="./metronome.js?v=5"></script>
  <script>
    // Firebaseの接続情報がない状態ではアプリを起動しない。
    (function(){
      const c=window.KORYO_FIREBASE_CONFIG;
      const configured=c&&c.apiKey&&!c.apiKey.startsWith('PASTE_')&&c.appId&&!c.appId.startsWith('PASTE_')&&c.databaseURL;
      if(!configured){
        document.getElementById('auth-message').textContent='FirebaseのWebアプリ設定が未入力です。READMEに従って firebase-config.js を設定してください。';
        document.querySelector('.auth-spinner').hidden=true;
      }else{
        const module=document.createElement('script');
        module.type='module'; module.src='./firebase-client.js?v=5';
        module.onerror=()=>{document.getElementById('auth-message').textContent='Firebase SDKを読み込めません。インターネット接続を確認してください。';document.querySelector('.auth-spinner').hidden=true;};
        document.body.append(module);
      }
    })();
  </script>
</body>
</html>
